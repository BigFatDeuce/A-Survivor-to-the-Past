<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>WebGL2 Horde Bench</title>
<style>
  html, body { margin: 0; background: #000; color: #fff; font: 14px monospace; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
  #hud { position: fixed; top: 8px; left: 8px; background: #000a; padding: 6px 8px; white-space: pre; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">chargement…</div>
<script type="module">
import { Sim } from "./sim.js";

const canvas = document.getElementById("c");
const hud = document.getElementById("hud");
const gl = canvas.getContext("webgl2", { antialias: false, alpha: false, powerPreference: "high-performance" });
canvas.width = 1920; canvas.height = 1080;

const vs = `#version 300 es
layout(location=0) in vec2 corner;
layout(location=1) in vec3 inst; // x, y, frame
uniform vec2 cam; uniform vec2 viewHalf;
out vec2 uv;
void main() {
  float f = inst.z;
  vec2 cell = vec2(mod(f, 8.0), floor(f / 8.0));
  uv = (cell + vec2(corner.x, 1.0 - corner.y)) / 8.0;
  vec2 p = inst.xy + (corner - 0.5) * 32.0;
  gl_Position = vec4((p - cam) / viewHalf, 1.0 - inst.y / 8192.0, 1.0);
}`;
const fs = `#version 300 es
precision mediump float;
in vec2 uv; uniform sampler2D tex; out vec4 o;
void main() { vec4 c = texture(tex, uv); if (c.a < 0.5) discard; o = c; }`;
function sh(t, s) { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(x); return x; }
const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(prog); gl.useProgram(prog);

const quad = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0,0, 1,0, 0,1, 1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const instBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0); gl.vertexAttribDivisor(1, 1);

const img = new Image();
await new Promise((ok, ko) => { img.onload = ok; img.onerror = ko; img.src = "enemies.png"; });
const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL);
gl.uniform2f(gl.getUniformLocation(prog, "cam"), 2048, 2048);
gl.uniform2f(gl.getUniformLocation(prog, "viewHalf"), 960 * 1.4, 540 * 1.4);

const sizes = [5000, 10000, 25000, 50000, 100000];
const results = [];
window.benchResults = results;

async function runOne(n) {
  const sim = new Sim(n, n / 2);
  const data = new Float32Array(n * 3);
  gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
  gl.bufferData(gl.ARRAY_BUFFER, data.byteLength, gl.DYNAMIC_DRAW);
  let tick = 0; const cpu = []; const frames = []; let last = performance.now(); const t0 = last;
  return new Promise(resolve => {
    function frame(now) {
      const c0 = performance.now();
      sim.tick(1 / 60); tick++;
      const anim = (tick >> 3) & 3;
      const ex = sim.ex, ey = sim.ey;
      for (let i = 0; i < n; i++) { const k = i * 3; data[k] = ex[i]; data[k + 1] = ey[i]; data[k + 2] = ((i * 4) % 60) + anim; }
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, data);
      gl.clearColor(0.05, 0.1, 0.05, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, n);
      const c1 = performance.now();
      if (now - t0 > 2000) { cpu.push(c1 - c0); frames.push(now - last); }
      last = now;
      hud.textContent = `N=${n}  cpu=${(c1 - c0).toFixed(2)} ms\n` + results.map(r => `${r.n}: ${r.fps} fps, cpu ${r.cpu} ms`).join("\n");
      if (now - t0 > 7000) {
        const avg = a => a.reduce((x, y) => x + y, 0) / a.length;
        const sorted = [...cpu].sort((a, b) => a - b);
        resolve({ n, fps: Math.round(1000 / avg(frames)), cpu: avg(cpu).toFixed(2), cpuP99: sorted[Math.floor(sorted.length * 0.99)].toFixed(2) });
      } else requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
}
// Mode synchrone (?sync=1) : independant du rafraichissement/throttling de l'onglet.
// Chaque frame = sim + upload + draw + gl.finish() (attend la fin du GPU).
function runSync(n) {
  const sim = new Sim(n, n / 2);
  const data = new Float32Array(n * 3);
  gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
  gl.bufferData(gl.ARRAY_BUFFER, data.byteLength, gl.DYNAMIC_DRAW);
  const ms = [];
  for (let tick = 0; tick < 420; tick++) {
    const c0 = performance.now();
    sim.tick(1 / 60);
    const anim = (tick >> 3) & 3;
    for (let i = 0; i < n; i++) { const k = i * 3; data[k] = sim.ex[i]; data[k + 1] = sim.ey[i]; data[k + 2] = ((i * 4) % 60) + anim; }
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, data);
    gl.clearColor(0.05, 0.1, 0.05, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, n);
    gl.finish();
    if (tick >= 120) ms.push(performance.now() - c0);
  }
  const avg = ms.reduce((a, b) => a + b, 0) / ms.length; ms.sort((a, b) => a - b);
  return { n, fps: Math.round(1000 / avg), cpu: avg.toFixed(2), cpuP99: ms[Math.floor(ms.length * 0.99)].toFixed(2) };
}
if (new URLSearchParams(location.search).has("sync")) {
  for (const n of sizes) { results.push(runSync(n)); await new Promise(r => setTimeout(r, 0)); }
} else {
  for (const n of sizes) results.push(await runOne(n));
}
hud.textContent = "TERMINE\n" + results.map(r => `${r.n}: ${r.fps} fps (plafond = rafraichissement ecran), cpu moyen ${r.cpu} ms, p99 ${r.cpuP99} ms`).join("\n");
window.benchDone = true;
</script>
</body>
</html>
