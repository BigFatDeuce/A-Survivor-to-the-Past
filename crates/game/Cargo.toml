[package]
name = "game"
version.workspace = true
edition.workspace = true

[[bin]]
name = "a_survivor_to_the_past"
path = "src/main.rs"

[dependencies]
engine.workspace = true
sim.workspace = true
assetkit.workspace = true
serde.workspace = true
ron.workspace = true
log.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { version = "3.7.0", default-features = false }
env_logger.workspace = true
open.workspace = true
ureq = { version = "3.5.2", features = ["json"] }
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
sha2 = "0.11.1"
serde_json = "1.0.154"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.130"
js-sys = "0.3.107"
web-sys = { version = "0.3.107", features = ["Window", "Storage", "Navigator", "Location", "UrlSearchParams", "console"] }

[build-dependencies]
winresource = "0.1"
