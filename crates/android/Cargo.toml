# Version Android : le jeu (crates/game/src/main.rs) compile en bibliotheque pour NativeActivity.
# Hors de l'espace de travail : rien ne change pour Windows, Linux, macOS et le web.
# Construction : research/tools/make_apk.py (cibles aarch64-linux-android et x86_64-linux-android, NDK).
[package]
name = "astp-android"
# meme version que l'espace de travail (verifie par make_apk.py)
version = "0.9.1"
edition = "2021"
publish = false

[lib]
name = "astp"
path = "../game/src/main.rs"
crate-type = ["cdylib"]

[dependencies]
engine = { path = "../engine" }
sim = { path = "../sim" }
assetkit = { path = "../assetkit" }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
log = "0.4"
serde_json = "1.0.154"
ureq = { version = "3.5.2", features = ["json"] }
android_logger = "0.15"
env_filter = "0.1"
# presse-papiers par JNI (deja tires par cpal et winit)
jni = "0.22"
ndk-context = "0.1"
# coop en ligne (WebSocket), comme crates/game
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

[profile.release]
lto = "thin"
strip = true
