[package]
name = "engine"
version.workspace = true
edition.workspace = true

[dependencies]
wgpu.workspace = true
winit.workspace = true
bytemuck.workspace = true
image.workspace = true
glam.workspace = true
serde.workspace = true
ron.workspace = true
kira.workspace = true
gilrs.workspace = true
log.workspace = true
assetkit.workspace = true
web-time = "1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgl"] }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlAudioElement", "HtmlMediaElement", "AudioContext", "AudioContextState", "BaseAudioContext", "AudioNode", "AudioParam", "AudioDestinationNode", "BiquadFilterNode", "BiquadFilterType", "GainNode", "MediaElementAudioSourceNode", "WaveShaperNode", "ChannelCountMode", "ChannelInterpretation", "AudioBuffer", "AudioBufferSourceNode", "AudioScheduledSourceNode", "Response"] }
