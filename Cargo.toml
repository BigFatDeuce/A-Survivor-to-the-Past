[workspace]
resolver = "2"
members = [
    "crates/assetkit",
    "crates/engine",
    "crates/sim",
    "crates/game",
    "tools/forge",
]
exclude = ["research"]

[workspace.package]
version = "0.2.0"
edition = "2021"

[workspace.dependencies]
wgpu = "30"
winit = { version = "0.30", features = ["serde"] }
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
glam = { version = "0.34", features = ["bytemuck", "serde"] }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
kira = { version = "0.12", default-features = false, features = ["cpal", "ogg", "vorbis", "wav"] }
gilrs = { version = "0.11", features = ["serde-serialize"] }
log = "0.4"
env_logger = "0.11"
assetkit = { path = "crates/assetkit" }
engine = { path = "crates/engine" }
sim = { path = "crates/sim" }
open = "5"

# Dev : nos crates compilent vite, les dependances sont optimisees (jeu fluide meme en debug)
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
